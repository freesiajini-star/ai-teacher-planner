-size:12px;padding:8px 11px;border-radius:999px;background:#f3f5fb;color:#7d879e;border:1px solid #e3e7f1;white-space:nowrap}.connection-badge.ready{background:#eefaf4;color:#23724a;border-color:#bde6cf}.connection-badge.warn{background:#fff8e8;color:#9a6a08;border-color:#f1d58a}.connection-badge.offline{background:#fff0f0;color:#a23a3a;border-color:#efc0c0}.dropzone.dragging{border-color:#6878e8!important;background:#f4f6ff!important}.review-area{margin-top:14px;border:1px solid #e5e9f3;border-radius:18px;padding:14px;background:#f8faff}.review-section{margin-bottom:14px}.review-section:last-child{margin-bottom:0}.review-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}.review-head h3{margin:0;font-size:14px}.review-head span{font-size:11px;color:#7b86a0}.review-row{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:9px;padding:9px 10px;background:#fff;border:1px solid #edf0f6;border-radius:10px;margin-top:6px;font-size:11px}.review-row input{accent-color:var(--accent)}.review-row b{font-weight:650;color:#25304a}.review-row .meta{color:#7a8499;text-align:right;max-width:48%;line-height:1.5}.review-row.uncertain{background:#fffaf0;border-color:#f2dfb3}.review-empty{padding:10px;color:#8b95a8;font-size:11px}.imported-panel{margin-top:18px;padding:18px 20px;border:1px solid #e5e9f3;border-radius:18px;background:rgba(255,255,255,.7);display:flex;justify-content:space-between;align-items:center}.imported-panel h2{margin:3px 0;font-size:18px}.imported-panel p{margin:0;color:#7a8499;font-size:12px}.primary:disabled{opacity:.55;cursor:default}.danger{color:#9b4444!important;background:#fff1f1!important}
</style><script>const periods=[['1교시','09:00–09:40'],['2교시','09:50–10:30'],['중간놀이','10:30–10:50'],['3교시','10:50–11:30'],['4교시','11:35–12:15'],['5교시','12:20–13:00'],['점심','13:00–14:00'],['6교시','14:00–14:40']];const demo=[['국어','주장하는 글 읽기','12차시'],['수학','분수의 덧셈','5–6차시'],['국어','주장하는 글 읽기','13차시'],['수학','분수의 덧셈','7차시'],['체육','축구형 게임','운동장'],['수학','분수의 덧셈','7차시'],['영어','What do you want?','4차시'],['사회','우리 지역의 모습','8차시'],['국어','주장하는 글 쓰기','14차시'],['수학','분수의 덧셈','8차시'],['영어','Let's play together','5차시'],['국어','주장하는 글 쓰기','15차시'],['체육','축구형 게임','운동장'],['과학','물질의 상태','3차시'],['영어','Let's play together','6차시'],['사회','우리 지역의 모습','9차시'],['수학','분수의 덧셈','9차시'],['국어','주장하는 글 쓰기','16차시'],['영어','Let's play together','7차시'],['과학','물질의 상태','4차시'],['과학','물질의 상태','2차시'],['사회','우리 지역의 모습','10차시'],['수학','분수의 덧셈','10차시'],['체육','축구형 게임','강당'],['국어','주장하는 글 쓰기','17차시']];const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const color=s=>({국어:'mint',수학:'lavender',영어:'blue',사회:'sand',체육:'peach',과학:'teal'})[s]||'violet';function render(rows=demo){let h='',i=0;periods.forEach((p,pi)=>{h+=`<div class="time-cell"><strong>${p[0]}</strong><span>${p[1]}</span></div>`;if(pi===2){for(let d=0;d<5;d++)h+='<div class="break-fill">쉬는 시간</div>';return}if(pi===6){for(let d=0;d<5;d++)h+='<div class="lunch-fill">점심시간</div>';return}for(let d=0;d<5;d++){if(pi===7&&d!==1&&d!==3){h+='<div class="empty-cell">—</div>';continue}let x=rows[i++]||['','',''];h+=x[0]?`<div class="lesson ${color(x[0])}"><strong>${esc(x[0])}</strong><span>${esc(x[1])}</span><small>${esc(x[2])}</small></div>`:'<div class="empty-cell">—</div>'}});$('timeline').innerHTML=h}render();$('settingsButton').onclick=()=>alert('실제 앱에서는 Firebase App Check 사이트 키를 설정합니다.');$('openImport').onclick=()=>{$('importModal').classList.add('open')};$('closeImport').onclick=$('cancelImport').onclick=()=>{$('importModal').classList.remove('open')};$('fileInput').onchange=e=>$('fileList').innerHTML=[...e.target.files].map(f=>`<div class="file-row"><span>${esc(f.name)}</span><span>${f.type||'파일'} · ${(f.size/1024/1024).toFixed(1)}MB</span></div>`).join('');$('analyzeButton').onclick=()=>{if($('analyzeButton').dataset.mode==='apply'){const d=window.mock;const tt=d.timetable;const rows=[];for(let p=1;p<=6;p++)for(let day=0;day<5;day++){const x=tt.find(x=>x.weekday===['월','화','수','목','금'][day]&&x.period===p+'교시');rows.push(x?[x.subject,x.note||'',x.teacher||'']:['','',''])}render(rows);$('dataSummary').textContent='봉산초등학교 · 2026학년도';$('saveState').textContent='과목 7 · 시간표 25 · 학사일정 3 · 교육과정 4';$('analysisStatus').textContent='39개 항목을 실제 앱 데이터로 반영했습니다.';return}const d=window.mock={school:{name:'봉산초등학교',schoolYear:'2026학년도'},subjects:[{name:'국어',kind:'기본과목',confidence:'high'},{name:'수학',kind:'기본과목',confidence:'high'},{name:'영어',kind:'기본과목',confidence:'high'},{name:'사회',kind:'기본과목',confidence:'high'},{name:'과학',kind:'기본과목',confidence:'high'},{name:'체육',kind:'기본과목',confidence:'high'},{name:'창의적 체험활동',kind:'기타',confidence:'medium'}],timetable:[...demo.map((x,i)=>({weekday:['월','화','수','목','금'][i%5],period:(Math.floor(i/5)+1)+'교시',subject:x[0],teacher:'담임',room:'',note:x[1],confidence:'high'}))],academicEvents:[{startDate:'2026-10-03',endDate:'2026-10-05',title:'개천절 및 대체공휴일',grades:[],period:'',note:'',confidence:'high'},{startDate:'2026-10-09',endDate:'2026-10-09',title:'한글날',grades:[],period:'',note:'',confidence:'high'},{startDate:'2026-10-14',endDate:'2026-10-14',title:'3학년 생존수영',grades:['3학년'],period:'8교시',note:'',confidence:'high'}],curriculumItems:[{subject:'수학',unit:'분수의 덧셈',activity:'분수의 덧셈',periods:'5–10차시',confidence:'high'},{subject:'국어',unit:'주장하는 글',activity:'읽기와 쓰기',periods:'12–17차시',confidence:'high'},{subject:'과학',unit:'물질의 상태',activity:'물질의 상태 알아보기',periods:'2–4차시',confidence:'high'},{subject:'사회',unit:'우리 지역의 모습',activity:'지역의 특징 알아보기',periods:'8–10차시',confidence:'high'}],uncertainItems:[]};const sec=(title,arr,fn)=>`<div class="review-section"><div class="review-head"><h3>${title}</h3><span>${arr.length}건</span></div>${arr.map(fn).join('')||'<div class="review-empty">찾은 항목이 없습니다.</div>'}</div>`;const row=(a,b)=>`<label class="review-row"><input type="checkbox" checked><b>${esc(a)}</b><span class="meta">${esc(b)}</span></label>`;$('reviewArea').innerHTML=`<div class="review-section"><div class="review-head"><h3>학교 · ${d.school.name}</h3><span>${d.school.schoolYear}</span></div></div>`+sec('과목',d.subjects,x=>row(x.name,x.kind+' · 확신도 '+x.confidence))+sec('시간표',d.timetable,x=>row(x.weekday+' '+x.period+' · '+x.subject,(x.teacher||'담당자 미확인')))+sec('학사일정',d.academicEvents,x=>row(x.startDate+' · '+x.title,(x.grades||[]).join(', ')))+sec('교육과정',d.curriculumItems,x=>row(x.subject+' · '+x.unit,(x.activity||'')+' · '+x.periods));$('reviewArea').hidden=false;$('analysisStatus').textContent='분석 완료. 내용을 확인한 뒤 [선택 항목 반영]을 누르세요.';$('analyzeButton').textContent='선택 항목 반영';$('analyzeButton').dataset.mode='apply'};</script></body></html>
